<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pokédex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="app">

    <!-- top navbar: logo + search -->
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="pokeball-icon" aria-hidden="true"></span>
          <span class="logo">Pokédex</span>
        </div>

        <div class="topbar-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input id="searchInput" type="text" placeholder="Search Pokémon by name or ID…" autocomplete="off" />
        </div>

        <span class="pokeball-icon pokeball-icon-ghost" aria-hidden="true"></span>
      </div>
    </header>

    <div class="content-wrapper">

      <!-- sort + type filter controls -->
      <section class="console" aria-label="Sort and Filter">

        <div class="field">
          <label>Sort by</label>
          <div class="sort-toggle">
            <button class="sort-btn active" data-sort="id" id="sortIdBtn">ID No.</button>
            <button class="sort-btn" data-sort="name" id="sortNameBtn">Name</button>
          </div>
        </div>

        <div class="field filter-dropdown">
          <label>Filter by</label>

          <div class="dropdown-wrapper">
            <div class="filter-select" id="filterSelect">
              <span id="selectedTypes">All Types</span>
              <span class="filter-arrow">▼</span>
            </div>

            <div class="filter-menu" id="filterMenu">
              <button class="filter-pill all active" data-type="all">All Types</button>
              <button class="filter-pill" data-type="normal">Normal</button>
              <button class="filter-pill" data-type="fire">Fire</button>
              <button class="filter-pill" data-type="water">Water</button>
              <button class="filter-pill" data-type="grass">Grass</button>
              <button class="filter-pill" data-type="electric">Electric</button>
              <button class="filter-pill" data-type="ice">Ice</button>
              <button class="filter-pill" data-type="fighting">Fighting</button>
              <button class="filter-pill" data-type="poison">Poison</button>
              <button class="filter-pill" data-type="ground">Ground</button>
              <button class="filter-pill" data-type="flying">Flying</button>
              <button class="filter-pill" data-type="psychic">Psychic</button>
              <button class="filter-pill" data-type="bug">Bug</button>
              <button class="filter-pill" data-type="rock">Rock</button>
              <button class="filter-pill" data-type="ghost">Ghost</button>
              <button class="filter-pill" data-type="dragon">Dragon</button>
              <button class="filter-pill" data-type="dark">Dark</button>
              <button class="filter-pill" data-type="steel">Steel</button>
              <button class="filter-pill" data-type="fairy">Fairy</button>
            </div>
          </div>
        </div>

      </section>

      <!-- pokemon card grid -->
      <main>
        <section class="grid" id="cardGrid" aria-live="polite"></section>

        <div class="empty-state" id="emptyState" hidden>
          <p>No matches</p>
          <span>Try a different name or ID number.</span>
        </div>

        <div class="error-state" id="errorState" hidden>
          <p>Couldn't load Pokémon</p>
          <span>Check your internet connection and try again.</span>
          <button id="retryBtn" class="btn btn-primary">Retry</button>
        </div>

        <div class="load-more-wrap">
          <button id="loadMoreBtn" class="btn btn-primary">Load More</button>
          <div class="spinner" id="spinner" hidden><span></span><span></span><span></span></div>
        </div>
      </main>

    </div>

    <footer class="page-footer">
      <span>Pokedex 2026</span>
    </footer>
  </div>

  <!-- detail popup -->
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalName">

      <div class="modal-scan" id="modalScan" hidden>
        <div class="spinner"><span></span><span></span><span></span></div>
        <span>Loading…</span>
      </div>

      <div class="modal-body" id="modalBody" hidden>

        <div class="modal-banner" id="modalBanner">
          <button class="modal-back" id="modalClose" aria-label="Back to list">←</button>
          <span class="modal-banner-title">Pokédex</span>
          <span class="modal-id" id="modalId">#001</span>
          <img id="modalImg" class="modal-img" alt="" />
        </div>

        <div class="modal-content">
          <h2 class="modal-name" id="modalName">—</h2>
          <div class="modal-types" id="modalTypes"></div>

          <div class="modal-metrics">
            <div class="metric">
              <span class="metric-value" id="modalWeight">—</span>
              <span class="metric-label">Weight</span>
            </div>
            <div class="metric">
              <span class="metric-value" id="modalHeight">—</span>
              <span class="metric-label">Height</span>
            </div>
            <div class="metric">
              <span class="metric-value" id="modalCategory">—</span>
              <span class="metric-label">Category</span>
            </div>
          </div>

          <h3 class="section-title">Abilities</h3>
          <div class="chip-row" id="modalAbilities"></div>

          <h3 class="section-title">Base Stats</h3>
          <div class="stats-list" id="modalStats"></div>

          <h3 class="section-title">Weak against</h3>
          <div class="chip-row" id="modalWeakness"></div>

          <h3 class="section-title">Evolution Chain</h3>
          <div id="modalEvolution" class="evolution-chain"></div>

          <div class="modal-nav">
            <button id="prevBtn" class="btn">← Previous</button>
            <button id="nextBtn" class="btn">Next →</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
